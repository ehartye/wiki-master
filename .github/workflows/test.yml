name: test
on:
  push:
    branches: [main]
  pull_request:
  # On-demand re-run. Without this, verifying CI after a red streak or a manual
  # disable requires manufacturing a commit just to trigger the workflow.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
